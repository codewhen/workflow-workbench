[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "release-workbench"
version = "0.18.1"
description = "Local workflow canvas, parallel test runner and release evidence workbench"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "CodeWhen"}]
dependencies = ["ruamel.yaml>=0.18,<0.20", "jsonschema>=4.23,<5", "psutil>=6,<8"]

[project.urls]
Repository = "https://github.com/codewhen/release-workbench"
Documentation = "https://github.com/codewhen/release-workbench/tree/main/docs"

[project.scripts]
workbench = "release_workbench.interfaces.cli:main"
release-workbench = "release_workbench.interfaces.cli:main"
workflow-workbench = "release_workbench.interfaces.cli:main"

[tool.setuptools.package-data]
release_workbench = ["schema.json", "NOTICE.txt", "THIRD_PARTY_NOTICES.txt", "THIRD_PARTY_DOCUMENTATION_NOTICES.txt", "static/**/*", "static/*", "documentation/**/*", "documentation/*"]

[project.optional-dependencies]
dev = ["build>=1,<2", "ruff>=0.14,<1", "mypy>=1.18,<2", "types-jsonschema", "types-psutil"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF012"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.setuptools.exclude-package-data]
release_workbench = ["**/__pycache__/*", "**/*.pyc"]
